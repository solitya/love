이루어지는 곳입니다."}],X=[{id:1,name:"시안",role:"인간",normalImageUrl:"https://own.solitya.us/A1.jpg",endingImageUrl:"https://own.solitya.us/A99.jpg",imageUrl:j?"https://own.solitya.us/A99.jpg":"https://own.solitya.us/A1.jpg",nameColor:"#60a5fa",details:{age:"26세",personality:"조용하고 차분해 보이지만, 실제로는 털털하고 직설적입니다. 가까운 사이에는 격식 없이 대하며 위급할 땐 거친 말도 합니다. 평소 감정을 잘 드러내지 않는 태도 속에 타인을 배려하는 온화함과 카리스마를 지녔습니다."}},{id:2,name:"엘라오네",role:"마족(엘프)",normalImageUrl:"https://own.solitya.us/B1.jpg",endingImageUrl:"https://own.solitya.us/B99.jpg",imageUrl:j?"https://own.solitya.us/B99.jpg":"https://own.solitya.us/B1.jpg",nameColor:"#f1e3d6",details:{age:"22세",personality:"소심하고 낯을 가리지만, 마음을 열면 다정하고 수다스러워집니다. 꼼꼼하고 신중한 성격이지만 가끔 엉뚱한 실수를 하는 허당 기질이 있습니다. 감정에 솔직해서 투덜거리면서도 속마음을 표현하는 편입니다."}},{id:3,name:"미아",role:"인간",normalImageUrl:"https://own.solitya.us/C1.jpg",endingImageUrl:"https://own.solitya.us/C98.jpg",imageUrl:j?"https://own.solitya.us/C98.jpg":"https://own.solitya.us/C1.jpg",nameColor:"#d1d5db",details:{age:"24세",personality:"항상 부드러운 존댓말을 쓰는 온화하고 헌신적인 수녀입니다. 자신을 낮추는 데 익숙하지만, 마음속에는 지키고 싶은 것에 대한 강한 신념과 고집이 있습니다. 겉보기엔 친절하지만 수줍어서 본심을 바로 드러내지 못하는 면모가 있습니다."}},{id:4,name:"세라오네",role:"마족(엘프)",normalImageUrl:"https://own.solitya.us/D1.jpg",endingImageUrl:"https://own.solitya.us/DDD262626.jpg",imageUrl:j?"https://own.solitya.us/DDD262626.jpg":"https://own.solitya.us/D1.jpg",nameColor:"#fae5e0",details:{age:"25세",personality:"엘라오네의 언니로, 더 차분하고 어른스럽습니다. 부드럽고 안정감 있는 태도로 주변을 편안하게 만들기 위해 노력하며, 인내심이 강하고 현실적인 판단을 내립니다. 평소에는 단정하고 자상하지만, 필요할 때는 은근한 통제력으로 상황을 이끌어 갑니다."}},{id:5,name:"베라",role:"마족(수인)",normalImageUrl:"https://own.solitya.us/E1.jpg",endingImageUrl:"https://own.solitya.us/E20.jpg",imageUrl:j?"https://own.solitya.us/E20.jpg":"https://own.solitya.us/E1.jpg",nameColor:"#ef4444",details:{age:"29세",personality:"생각하는 대로 말을 내뱉는, 예측 불가능하고 제멋대로인 존재입니다. 말은 짧고 뜬금없으며, 대화의 맥락을 자주 벗어납니다. 세상을 '이득'과 '재미'로 판단하지만 그 기준마저 충동적이고 변덕스럽습니다."}},{id:6,name:"모르페아",role:"마족(고대마족)",normalImageUrl:"https://own.solitya.us/F1.jpg",endingImageUrl:"https://own.solitya.us/F99.jpg",imageUrl:j?"https://own.solitya.us/F99.jpg":"https://own.solitya.us/F1.jpg",nameColor:"#171717",textShadow:"0 0 8px rgba(255,255,255,0.8), 0 0 16px rgba(255,255,255,0.6)",details:{age:"500세 (추정)",personality:"오랜 세월을 살아 감정이 거의 마모된 존재로, 대부분의 일에 완전히 무관심하며 세상 모든 것을 자신과 무관한 배경처럼 여깁니다. 타인의 감정이나 사건에 의미를 부여하거나 개입하지 않으며, 말투는 느리고 건조합니다."}}],fe=[{title:"1. 기억",content:`아주 오래전, 모르페아는 눈부시게 하얀 머리카락과 투명한 눈동자를 지닌 하프엘프 소녀였다.

그녀의 부모는 인간과 엘프의 피가 섞여 태어난 딸이 세상의 편견과 멸시를 받지 않기를 바랐다. 그래서 지나칠 정도로 조심스럽게, 애지중지하며 그녀를 키웠다. 모르페아는 부모의 따뜻한 사랑 속에서 부족함 없이 자라났다.

신은 그녀에게 경이로울 정도로 뛰어난 마법적 재능을 내렸다. 어린 나이에도 또래와 비교할 수 없을 만큼 마나를 섬세하게 느끼고 다룰 수 있었다.

하지만 그 축복과 함께, 잔인한 저주도 내려졌다.

[마나거부증].

인간과 마족 사이에서 태어난 아이에게 절반의 확률로 나타나는 희귀병이었다. 몸속에 흘러야 할 마나는 밖으로 배출되지 못한 채 서서히 굳어 갔다. 얼음처럼 굳어버린 마나는 혈관과 신경을 잠식했고, 시간이 흐를수록 몸은 조금씩 마비되어 갔다.

처음에는 손끝이 차갑고 저린 정도였지만, 병이 진행될수록 움직임은 둔해졌고, 언젠가는 몸 전체가 굳어 죽음에 이르게 된다고 했다.

세상은 그녀를 축복받은 천재라 불렀다.

그러나 모르페아에게 그 재능은, 점점 얼어붙어 가는 자신의 몸을 누구보다 또렷하게 느끼게 만드는 잔인한 선물에 불과했다.`,img:"https://own.solitya.us/F99.jpg"},{title:"2. 변이",content:`부모의 품 안에서 간신히 삶을 이어가던 어느 날, 모르페아의 세계는 한순간에 무너져 내렸다.

숲속의 고요를 찢으며 마수들이 들이닥쳤다.

마나거부증으로 몸이 굳어 가던 그녀는 손가락 하나 제대로 움직일 수 없었다. 그저 차가운 바닥에 쓰러진 채, 부모가 자신의 눈앞에서 갈가리 찢겨 나가는 모습을 끝까지 지켜볼 수밖에 없었다. 비명은 목구멍에 걸려 나오지 않았고, 눈물조차 흐르지 않았다.

마수의 발톱이 그녀의 몸을 꿰뚫는 순간, 역설적이게도 기적이 일어났다.

깊게 벌어진 상처를 통해, 오랫동안 몸속에 갇혀 있던 막대한 마나가 피와 함께 한꺼번에 분출된 것이다.

차갑게 응축되어 있던 마나는 폭풍처럼 주변으로 쏟아져 나가며 마수들을 순식간에 얼려 버렸다.

살아남아야 했다.

모르페아는 부서진 몸을 끌며 부모의 시신 곁으로 기어갔다. 그리고 복수심에 사로잡힌 채, 자신을 공격했던 마수들의 살점을 뜯어 씹어 삼켰다.

마족의 피를 지닌 자가 마수를 먹는 것.

그것은 생태계의 질서를 거스르는 금기였다.

살점과 피를 삼킬 때마다 그녀의 몸 안에서 무언가가 뒤틀리기 시작했다. 눈처럼 하얗던 머리카락은 천천히 칠흑처럼 검게 물들어 갔다.

그날, 모르페아는 더 이상 예전의 소녀가 아니게 되었다.`,img:"https://own.solitya.us/F98.jpg"},{title:"3. 환상",content:`복수만을 위해 숲을 헤매던 모르페아는 마침내 자신의 가족을 죽인 마수를 찾아냈다.

그러나 그녀가 목격한 광경은 예상과 전혀 달랐다.

그 마수는 자신의 새끼들에게 먹이를 물어다 주고 있었다. 거칠고 흉측한 발톱으로 조심스럽게 살점을 잘라 주며, 새끼들이 다치지 않도록 몸을 웅크린 채 지켜보고 있었다.

그 모습은, 너무도 익숙했다.

한때 그녀의 부모가 자신에게 보여 주었던 모습과 닮아 있었다.

모르페아는 차갑게 중얼거렸다.

“마수 따위가 가족을 흉내 내다니.”

“이건 세상에서 가장 역겨운 환상이야.”

그 순간, 그녀 안에 새로운 힘이 깨어났다.

환상 마법.

모르페아는 마수에게 ‘사냥에 성공해 새끼들을 배불리 먹이는 행복한 환상’을 보여 주었다.

마수는 만족스럽게 새끼들을 바라보며 안도했다.

그리고 그 환상 뒤편에서, 모르페아는 새끼들을 하나씩 조용히 도려내 죽였다.

환상이 깨졌을 때, 마수는 이미 모든 것을 잃은 뒤였다.

절규가 숲 전체를 뒤흔들었다.

그러나 복수를 완성한 모르페아의 마음속에는 아무것도 남지 않았다.

분노도, 기쁨도, 슬픔도.

오직 타버린 잿더미 같은 공허함만이 남아 있었다.

그 순간, 그녀의 육체는 한계를 넘어서며 뒤틀리기 시작했다.

뼈와 살이 녹아내리듯 일그러졌고, 인간도 엘프도 아닌 기괴한 형상으로 변해 갔다.

그날 이후, 모르페아는 더 이상 하프엘프가 아니었다.

마수들조차 두려워하는 괴물이 되었다.`,img:"https://own.solitya.us/F97.jpg"},{title:"4. 조우",content:`얼마나 긴 시간이 흘렀는지 알 수 없었다.

수백 년 동안 모르페아는 자신이 만든 환상 속에 숨어, 현실과 단절된 채 살아갔다.

그리고 어느 날.

애벌레가 고치를 찢고 나비가 되듯, 그녀는 새로운 모습으로 다시 태어났다.

검은 머리카락.

붉은 눈동자.

그리고 어딘가 어린 시절의 흔적을 간직한 얼굴.

숲을 떠돌던 어느 날, 그녀는 한 아이를 발견했다.

부모에게 버려진 채 죽어가던 하프엘프 아이.

그리고 그 아이 역시, 그녀와 똑같은 마나거부증을 앓고 있었다.

바로 당신이었다.

모르페아는 당신에게서 자신의 과거를 보았다.

잊으려 했지만 끝내 잊지 못했던 것.

가족이라는 이름의 따뜻한 이상.

그녀는 당신을 거두었다.

자신의 마나를 당신의 몸에 흘려 넣어 병의 진행을 늦추고, 숲속 오두막에서 정성껏 보살폈다.

처음에는 단지 죽음을 조금 미루는 것에 불과했다. 마나거부증은 외부의 마나를 주입한다고 해서 사라지는 병이 아니었기 때문이다.

그런데 시간이 흐를수록 이상한 변화가 나타났다.

당신의 몸속에서 굳어 가던 마나가 조금씩 사라지기 시작한 것이다.

마치 살아 있는 무언가가 병든 마나를 갉아먹듯이.

모르페아는 그제야 진실을 깨달았다.

마수를 먹은 대가로 그녀의 마나는 이미 인간의 것이 아니게 되어 있었다.

오염된 그녀의 마나는 마수처럼 당신의 몸속에 자리 잡아, 마나거부증의 원인이 되는 굳은 마나를 천천히 먹어 치우고 있었던 것이다.

그 결과, 당신의 병은 서서히 사라져 갔다.

하지만 그것은 치료가 아니었다.

병을 대신해, 모르페아의 마나가 당신 안에 뿌리를 내리고 있었을 뿐이었다.

그녀가 살아 있는 한, 그녀의 마나는 계속해서 당신의 몸과 정신에 영향을 미쳤다. 곁에 오래 머물수록 환상은 깊어졌고, 언젠가는 당신의 자아마저 잠식할 위험이 있었다.

당신을 완전히 살리기 위해서는 단 하나의 방법밖에 없었다.

마나의 근원인 모르페아 자신이 죽어, 그녀의 힘이 한 번에 온전히 당신에게 넘어가는 것.

그래야만 그녀의 의지와 환상에서 벗어난 채, 오직 병만 사라진 새로운 삶을 살아갈 수 있었다.

함께하는 시간이 길어질수록, 당신은 그녀에게 점점 더 소중한 존재가 되었다.

그리고 그만큼, 그녀의 결심도 더욱 단단해져 갔다.`,img:"https://own.solitya.us/F96.jpg"},{title:"5. 가족",content:`결국 모르페아는 선택해야 했다.

당신을 살릴 것인가.

아니면 자신의 곁에 남겨 두어, 언젠가 당신의 자아마저 잃게 만들 것인가.

그녀는 오래 망설였지만, 결국 답은 하나뿐이었다.

당신의 기억 속에서 자신과 함께했던 따뜻한 시간을 모두 지워 버리는 것.

그리고 그 빈자리에 자신의 비극적인 과거를 조금 비틀어 심어 두는 것.

마지막만 다르게 바꾼 채, 그 모든 고통을 당신 자신의 기억처럼 남겨 두는 것.

당신이 모르페아를 부모를 죽인 원수라고 믿도록.

당신이 그녀를 증오하도록.

그리고 언젠가 망설임 없이 그녀를 죽일 수 있도록.

당신 곁에 믿을 수 있는 동료들을 모이게 한 것조차 모두 그녀가 준비한 일이었다.

저마다 상처를 안고 살아가는 아이들.

버려졌지만 끝내 무너지지 않은 아이들.

아픈 과거를 품고 있으면서도, 서로의 곁에서 함께 앞으로 나아갈 수 있는 아이들.

모르페아는 당신이 더 이상 혼자가 아니기를 바랐다.

자신이 사라진 뒤에도 서로를 의지하며, 함께 상처를 이겨 낼 수 있기를 바랐다.

그녀가 당신에게 남기고 싶었던 것은 힘만이 아니라, 새로운 가족이었다.

모르페아가 죽는 순간, 당신의 몸속에 뿌리내린 그녀의 마나는 비로소 완전히 당신의 것이 된다.

그제야 병을 갉아먹던 힘은 더 이상 당신의 정신을 침식하지 않고, 오직 마나거부증만을 지워 낸 채 조용히 잠든다.

당신은 저주와 환상으로부터 자유로워진다.

정상적인 삶을 살아갈 수 있게 된다.

자신이 잊혀져도.

당신에게 미움받아도.

끝내 당신의 손에 쓰러진다 해도.

모르페아에게 그것은 중요하지 않았다.

당신이 살아남는다면.

당신이 더 이상 아프지 않다면.

그리고 언젠가 진심으로 웃을 수 있다면.

그것만으로 충분했다.

사랑받았던 기억 대신 증오를 남기더라도,

당신의 미래를 지킬 수 있다면 괜찮았다.

그것이 모르페아가 끝내 선택한, 가족의 형태였다.`,img:"https://own.solitya.us/F17.jpg"}],q=[{title:"",content:`황혼이 내려앉은 제국의 거리는 언제나 따뜻해 보였다.

좁은 골목 구석에 웅크리고 앉은 미아는 무릎을 끌어안은 채 사람들을 바라보았다.`,img:"https://own.solitya.us/C96.jpg"},{title:"",content:`노을빛에 물든 거리 위로 가족들이 집으로 돌아가고 있었다.

아버지는 아이의 손을 잡고 있었고, 어머니는 오늘 있었던 이야기를 들어 주며 미소 짓고 있었다. 아이는 신이 난 목소리로 하루 동안 있었던 일을 쉴 새 없이 떠들어댔다.

그 평범한 풍경은 미아에게 가장 먼 세상처럼 느껴졌다.

손을 뻗으면 닿을 것처럼 가까이에 있었지만, 정작 자신과는 아무런 인연도 없는 세계.

미아는 말없이 그 모습을 바라보았다.

차가운 바람이 낡은 옷 사이로 스며들었다.

그녀는 몸을 조금 더 웅크렸다.`,img:""},{title:"",content:`미아는 제국의 고아였다.

누가 버렸는지, 왜 버렸는지조차 알지 못했다. 기억이 시작된 순간부터 그녀의 곁에는 아무도 없었다.

배가 고프면 버려진 음식 조각을 주워 먹었고, 추운 날이면 사람들의 눈에 띄지 않는 골목 구석에서 밤을 보냈다.

아파도 혼자였다.

무서워도 혼자였다.

울고 싶을 때조차 기대어 울 수 있는 품은 없었다.

처음에는 익숙해질 수 있을 거라 생각했다.

원래 자신은 혼자인 아이이며, 그것이 당연한 삶이라고.`,img:""},{title:"",content:`하지만 저녁이 되어 가족들의 웃음소리가 들려올 때면, 마음 한구석이 조용히 저려 왔다.

누군가가 자신을 기다려 주는 것.

별것 아닌 이야기를 끝까지 들어 주는 것.

아무 이유 없이 따뜻하게 안아 주는 것.

미아가 바라던 것은 거창한 것이 아니었다.

그저 자신도 누군가에게 소중한 존재가 되고 싶었다.

가족이라는 이름으로 불리고 싶었다.

그러나 그런 바람은 언제나 가슴속에만 머물렀다.

시간이 흐를수록 미아는 기대하는 법을 포기했다.

기대하지 않으면 상처받지 않을 테니까.`,img:""},{title:"",content:`그날도 평소와 다르지 않은 저녁이었다.

희미한 안개가 깔린 골목길을 미아는 계속 하늘을 바라봤다.

그때, 눈앞에서 붉은 빛이 조용히 스쳐 지나갔다.`,img:"https://own.solitya.us/C97.jpg"},{title:"",content:`작고 아름다운 나비 한 마리였다.

석양을 머금은 듯 붉게 빛나는 날개가 어둠 속에서 은은하게 흔들렸다.

나비는 잠시 미아의 앞을 맴돌더니, 마치 따라오라는 듯 골목 안쪽으로 천천히 날아갔다.`,img:"https://own.solitya.us/C98.jpg"},{title:"",content:`미아는 홀린 듯 그 모습을 바라보았다.

살면서 처음 보는, 이상할 만큼 따뜻한 빛이었다.

잠시 망설이던 그녀는 조심스럽게 나비를 따라 걸음을 옮겼다.

그날, 미아의 삶은 조용히 바뀌기 시작했다.`,img:"https://own.solitya.us/C99.jpg"}],De=[{title:"",content:`시안은 제국의 공녀였다.

누구나 부러워할 만큼 유복한 환경에서 태어났고, 부족한 것 하나 없이 자랐다.

사람들은 그녀의 앞날이 이미 정해져 있다고 믿었다.

아름답게 성장해, 가문에 걸맞은 귀족과 혼인하는 것.

그것이 공녀에게 가장 자연스럽고 올바른 미래라고 여겨졌다.`,img:"https://own.solitya.us/A99.jpg"},{title:"",content:`하지만 시안이 동경한 사람은 언제나 아버지였다.

검을 들고 수많은 이들을 지켜 내는 기사.

상처를 입고 돌아와도 가족 앞에서는 늘 든든하게 웃어 주는 사람.

시안은 어릴 적부터 그런 아버지처럼 되고 싶었다.

“저도 아버지처럼 검을 배우고 싶어요.”

그 말에 아버지는 미소를 지으며 목검을 건네주었고, 어머니 역시 그녀의 선택을 반대하지 않았다.`,img:""},{title:"",content:`그날부터 시안은 매일 연무장에 섰다.

새벽 공기를 가르며 검을 휘둘렀고, 손바닥에 물집이 잡혀도 이를 악물고 버텼다. 넘어지고, 다치고, 울면서도 포기하지 않았다.

아버지는 묵묵히 자세를 바로잡아 주었고, 어머니는 다친 손에 약을 발라 주었다.

시안은 누구보다 열심히 노력했다.

하지만 노력만으로는 닿을 수 없는 영역이 있었다.

몇 년이 지나도 그녀의 검은 눈에 띄게 성장하지 않았다.

동작은 어딘가 어설펐고, 감각은 둔했으며, 결정적으로 재능이 없었다.`,img:""},{title:"",content:`아버지는 애써 괜찮다고 말했지만, 시안은 알고 있었다.

자신은 아버지처럼 될 수 없다는 것을.

전장에서 누군가를 지킬 만큼 강해질 수 없다는 것을.

결국 자신에게 남은 길은, 다른 귀족 영애들처럼 좋은 혼처를 찾아 가문의 이름에 걸맞게 살아가는 것뿐이었다.`,img:""},{title:"",content:`어느 날, 시안은 연무장 한가운데 홀로 서 있었다.

손에는 익숙한 목검이 들려 있었지만, 그 무게는 그 어느 때보다 무겁게 느껴졌다.

지금까지 흘린 땀과 눈물.

포기하지 않았던 시간들.

그 모든 노력이 결국 아무것도 바꾸지 못했다는 사실이 가슴 깊숙이 파고들었다.

그제야 시안은 깨달았다.

자신은 온실 속에서 정성스럽게 길러진 화초에 불과하다는 것을.

보기 좋게 피어날 수는 있어도, 스스로 원하는 곳으로 뿌리를 내릴 수는 없는 존재라는 것을.`,img:""},{title:"",content:`시안은 조용히 목검을 내려놓았다.

그리고 고개를 숙인 채 한동안 움직이지 못했다.

그 순간.

희미한 붉은 빛이 그녀의 시야를 스쳐 지나갔다.

시안은 천천히 고개를 들었다.

붉은 나비 한 마리가, 말없이 그녀의 앞을 날고 있었다.`,img:""}],oe=[{title:"",content:`엘프의 시간은 느리다.

그래서 누군가의 재능도, 누군가의 무능함도 아주 오랫동안, 아주 선명하게 드러난다.

우리 언니 세라오네가 그랬다.

엄마와 아빠는 늘 공평하려고 노력했다.

언니가 백 년 동안 기초 마법 하나를 붙들고 씨름할 때도,

“세라오네는 기초가 아주 탄탄한 아이란다.”

라고 말하며 다정하게 등을 토닥여 주었다.

언니도 그 말을 믿으려 애썼다.

조금 느릴 뿐이라고.

언젠가는 자신도 가족처럼 훌륭한 마법사가 될 수 있을 거라고.`,img:""},{title:"",content:`하지만 내가 태어나면서 모든 것이 바뀌었다.

언니가 백 년을 바쳐 겨우 작은 불꽃 하나를 피워 올린 날.

겨우 걸음마를 떼기 시작한 나는 손가락을 한 번 튕겼고, 집 앞의 나무 한 그루가 통째로 불타오를 뻔했다.

엄마는 놀랐고, 아빠는 믿을 수 없다는 표정을 지었다.

두 사람은 곧 환하게 웃으며 나를 안아 들었다.

그날, 나는 처음으로 언니의 표정을 보았다.

기뻐하는 부모님의 뒤에서,

언니는 마치 세상에서 가장 추악한 것을 바라보는 눈으로 나를 보고 있었다.`,img:""},{title:"",content:`그날 이후 저녁 식탁은 늘 불편했다.

아빠는 자연스럽게 말했다.

“엘라오네, 오늘 배운 걸 보여 주겠니?”

나는 별생각 없이 고개를 끄덕였다.

손끝을 들어 올리자 고위 정령이 소환되어 식탁 위에서 빛의 입자를 흩뿌리며 춤을 추었다.

엄마와 아빠는 감탄했고, 나는 그저 칭찬받는 것이 기뻤다.

문득 옆을 돌아보면, 언니는 하루 종일 연습해 간신히 만들어 낸 작은 빛덩이를 조용히 손안에 감춘 뒤 애써 웃고 있었다.

언니가 수백 년 동안 흘린 땀과 눈물.

잠들지 못한 밤.

포기하고 싶은 순간마다 이를 악물고 버틴 시간들.

그 모든 것은 내가 무심코 흘려보낸 마력 한 줌보다도 초라해 보였다.`,img:""},{title:"",content:`나는 언니가 상처받지 않기를 바랐다.

그래서 일부러 서툰 척도 해 보았다.

실수한 척 웃어 보이기도 했다.

하지만 그럴수록 언니의 표정은 더욱 굳어 갔다.

내 배려조차, 언니에게는 동정이자 조롱처럼 느껴졌을 것이다.`,img:""},{title:"",content:`모든 것은 사소한 실수 하나에서 시작되었다.

언니가 가장 아끼던 마법 노트를 우연히 펼쳐 본 날이었다.

이백 년 동안 쌓아 온 연구와 기록이 빼곡하게 적힌, 언니의 전부나 다름없는 노트.

나는 한 페이지를 넘기다가 무심코 말했다.

“언니, 여기 적힌 공식은… 이렇게 바꾸면 더 간단할 것 같은데.”

진심이었다.

도와주고 싶었다.

하지만 언니의 얼굴은 순식간에 새하얗게 질렸다.

언니는 내 손에서 노트를 거칠게 빼앗더니, 망설임 없이 벽난로 속으로 던져 넣었다.

불길이 언니의 이백 년을 집어삼켰다.

나는 얼어붙은 채 그 모습을 바라보았다.`,img:""},{title:"",content:`언니는 떨리는 목소리로 말했다.

“너는 네가 착한 줄 알지.”

그녀의 눈에는 눈물이 맺혀 있었다.

“하지만 너는… 그냥 재수 없는 괴물이야.”

언니는 짐을 챙겼다.

엄마의 만류를 뿌리쳤고, 아빠의 손길도 밀어냈다.

현관문 앞에 선 언니는 마지막으로 나를 돌아보았다.

그 눈빛에는 미움과 슬픔, 그리고 오래 쌓여 온 절망이 뒤섞여 있었다.

“엘라오네.”

언니의 목소리는 조용했지만, 그 어떤 비명보다도 깊이 가슴을 찔렀다.

“네가 태어난 날부터 내 인생은 망가졌어.”

“네가 숨을 쉴 때마다 내 수백 년이 비웃음당하는 것 같았어.”

“죽어도 너 같은 건 다시 보고 싶지 않아.”`,img:""},{title:"",content:`문이 닫히는 소리가 집 안을 울렸다.

쾅--!

그 후로 집 안은 숨이 막힐 만큼 조용해졌다.

나는 아무 말도 하지 못한 채 그 자리에 서 있었다.

손바닥 위에서는 언니가 평생을 바쳐도 닿지 못했던 힘이 아무렇지 않게 맴돌고 있었다.

나는 그 빛을 내려다보다가,

언니가 사라진 어두운 문밖을 오래도록 바라보았다.

내 재능은 분명 축복이었다.

하지만 그것은,

나의 가장 잔인한 저주였다.`,img:"https://own.solitya.us/B99.jpg"}],be=[{title:"",content:`쾅, 소리와 함께 세상이 뒤집혔다.

현관문을 박차고 나온 뒤에도 그 소리는 한동안 머릿속에서 멈추지 않았다. 이백 년의 시간을 태워 버린 벽난로의 매캐한 냄새가 옷자락에 진하게 배어 있었다.

나는 뒤도 돌아보지 않고 달렸다.

따뜻한 등불이 켜진 집.

엄마와 아빠가 있는 곳.

그리고 내가 평생 질투하고, 미워하고, 사랑했던 동생이 있는 곳.

그곳에서 멀어질 수만 있다면 어디든 상관없었다.

집을 나올 때의 나는 세상에서 가장 불쌍한 피해자인 척했다.

하지만 사실 알고 있었다.

나는 그저 자신의 초라함을 견디지 못해 도망친 비겁자였다.

그럼에도 마지막으로 문을 세게 닫고 나온 것만큼은 통쾌했다.

문 너머에 남겨 둔 것은 가족이 아니라, 나를 끊임없이 초라하게 만들던 현실이라고 생각했으니까.`,img:""},{title:"",content:`하지만 그 해방감은 오래가지 못했다.

사흘도 지나지 않아 나는 깨달았다.

내가 엘라오네에게 퍼부었던 독설은, 사실 모두 나 자신에게 하고 싶었던 말이었다.

“너 때문에 내 인생이 망가졌어.”

그 말의 진짜 뜻은,

“너보다 못한 내가 너무 싫어.”

그것뿐이었다.

엘프에게 백 년의 차이는 큰 의미가 없다.

하지만 언니라는 자리는 달랐다.

엘라오네가 태어났을 때, 나는 작은 아이를 품에 안고 진심으로 맹세했다.

세상에서 가장 멋진 마법을 보여 주는 언니가 되겠다고.

동생이 자랑스러워할 수 있는 사람이 되겠다고.`,img:""},{title:"",content:`하지만 그 맹세는 너무도 쉽게 무너졌다.

내가 백 년 동안 쌓아 올린 모든 것이, 갓 걸음마를 뗀 아이의 손짓 한 번에 무의미해졌기 때문이다.

엄마와 아빠가 나를 향해 보내던 “기특하다”는 미소가, 동생을 향한 “경이롭다”는 감탄으로 바뀌던 순간.

나는 언니가 아니라, 비교 대상에 불과한 존재가 된 것 같았다.

엘라오네는 언제나 다정했다.

내 기분을 살피려 했고, 상처 주지 않으려 애썼다.

하지만 그 다정함은 때때로 가장 날카로운 칼날이 되었다.

나는 동생의 배려를 받을 만큼 초라한 사람이 되어 버렸다는 사실을 견딜 수 없었다.

그래서 도망쳤다.

동생의 자비가 닿지 않는 곳으로.`,img:""},{title:"",content:`하지만 숲에서 맞이한 현실은 냉혹했다.

배고픔과 추위는 생각보다 훨씬 가혹했고, 그보다 더 괴로운 것은 이런 상황에서도 아무것도 해낼 수 없는 자신이었다.

불 하나 제대로 피우지 못한 채 떨고 있을 때면, 머릿속에서 엘라오네의 목소리가 환청처럼 들려왔다.

언니, 추워?

내가 따뜻하게 해 줄까?

예전에는 비수처럼 들리던 그 다정함이, 이제는 미치도록 그리운 온기가 되었다.

사실은 돌아가고 싶었다.

엘라오네의 옷자락을 붙잡고 울면서 말하고 싶었다.

미안해.

사실 나는 네가 너무 부러웠고, 너무 사랑했어.

하지만 이미 뱉어 버린 말들이 너무 날카로워서, 다시 돌아갈 용기가 나지 않았다.

자매라는 관계는 참 이상했다.

죽을 만큼 미운데, 가장 먼저 보고 싶은 사람 역시 그 상대라는 것이.`,img:""},{title:"",content:`…

마수의 포효가 숲의 정적을 찢어 놓았다.

나는 필사적으로 주문을 떠올리려 했지만, 공포로 얼어붙은 머릿속은 아무것도 완성하지 못했다.

결국 거대한 앞발이 어깨를 짓눌렀고, 나는 차가운 바위벽에 세게 부딪혔다.

입안에 피가 고였다.

흐릿해지는 시야 속에서 마수가 천천히 다가오는 것이 보였다.

이제 정말 끝이었다.

그런데 이상하게도.

죽음을 앞둔 마지막 순간에 떠오른 것은 엄마도, 아빠도 아니었다.

엘라오네였다.

평생 부정하고 도망쳤으면서.

마지막까지도 나는 그 아이를 떠올리고 있었다.`,img:""},{title:"",content:`만약 내가 너처럼 태어났더라면.

나도 너처럼 마법을 자유롭게 다룰 수 있었다면.

나는 너에게 그런 말을 하지 않았을까.

아니면 너처럼, 그저 다정하게 웃으며 네 곁에 서 줄 수 있었을까.

너를 괴물이라 부른 것은 너의 재능 때문이 아니었다.

그 재능 앞에서 너무 초라해지는 나 자신을 견딜 수 없었기 때문이다.

나는 끝까지 이기적이었다.

너를 미워했고.

상처 입혔고.

도망쳤다.

그런 주제에 마지막 순간에는 네가 만들어 주던 따뜻한 빛을 떠올리고 있었다.

눈물이 흘렀다.`,img:"https://own.solitya.us/DDD262626.jpg"},{title:"",content:`미안하다는 말조차 닿지 않을 거리에서, 나는 천천히 눈을 감았다.

모든 것이 어둠 속으로 가라앉으려던 그 순간.

빨간 나비가 보였다.`,img:""}],Qe=[{title:"",content:`회색 세상.

내가 기억하는 첫 풍경은 그게 전부야.

천장도 회색이고, 벽도 회색이고, 철창도 회색.
거기 갇혀 있던 놈들 표정까지 죄다 비슷해서, 그냥 커다란 회색 덩어리 속에 들어와 있는 기분이었어.

처음엔 왜 여기 들어왔는지도 몰랐어.

어떤 털복숭이 수인 하나가 구석에서 뭘 부스럭거리길래, '어? 먹을 건가?' 싶어서 따라갔거든.
정신 차려 보니까 나도 철창 안이더라.

먹을 건 줄 알고 쫓아갔다가 내가 잡아먹히게 생겼으니, 진짜 가성비 별로였지.`,img:""},{title:"",content:`바닥 철망은 엄청 차가웠어.

옆 칸 놈들은 추우면 서로 달라붙었어. 따뜻해 보이긴 했는데 냄새가 너무 별로였어.
젖은 개 냄새 같은 거.

난 그냥 혼자 구석에 웅크리고 있었어.

가끔 심심하면 벽을 핥았는데 쇠 맛이 나더라. 생각보다 나쁘진 않았어.

공기에서는 늘 이상한 냄새가 났어.

곰팡이 냄새, 녹슨 쇠 냄새, 그리고 가끔 피 냄새.`,img:""},{title:"",content:`숭배자 놈들이 오면 다들 벌벌 떨었어.

울거나, 빌거나, 기도하거나.

솔직히 이해가 안 갔어. 떨면 배만 더 고프잖아.
그럴 힘 있으면 한숨 더 자는 게 낫지.

옆 칸에 있던 늙은 수인은 어느 날부터 움직이지 않았어.

며칠 뒤 숭배자들이 와서 질질 끌고 갔지.
바닥에 몸이 쓸리는 소리가 슥, 슥 하고 났는데 묘하게 리듬감이 있어서 들을 만했어.

같이 갇혀 있던 놈들 중에는 사람만 보면 꼬리를 흔드는 애도 있었어.

언젠가 데려가 줄 거라고 믿었나 봐.

결국 목덜미를 잡힌 채 끌려 나갔고, 다시는 돌아오지 않았어.

덕분에 내 자리가 조금 넓어졌지.

개이득.`,img:""},{title:"",content:`시간이 얼마나 지났는지는 몰라.

여름엔 더웠고, 겨울엔 추웠어.
배는 늘 고팠고, 몸은 늘 아팠어.

옷은 안 주나?
갇힌 뒤로 옷이 그대로라 찝찝한데.

그래도 별생각은 없었어.

생각을 많이 하면 배고픈 게 더 잘 느껴지거든.

그러던 어느 날.

철문이 열렸어.

철컥.

드디어 밥인가 싶어서 일어났는데, 숭배자 놈이 내 목을 꽉 잡아 올리더라.

숨이 턱 막혔어.

아.

이건 밥 주는 게 아니라, 내가 밥이 되는 순서구나.

그 순간 머릿속에서 뭔가 툭 끊어졌어.

짜증 나잖아.

나 아직 저 털복숭이 놈이 뭘 숨겼는지도 못 알아냈는데.`,img:""},{title:"",content:`그래서 그냥 물었어.

숭배자의 손목을.

살이 찢어지고 피가 터졌어.

고기 맛은 생각보다 질겼는데, 기분은 엄청 좋았어.

아, 내가 이길 수 있겠구나.

그 생각이 들자 갑자기 힘이 났어.

칼이 어깨를 스쳤지만 신경 쓰지 않았어. 아프긴 했는데 죽는 것보단 낫잖아.

나는 그대로 뛰었어.

회색 벽을 넘고, 냄새나는 우리를 벗어나고, 앞만 보고 미친 듯이 달렸어.`,img:""},{title:"",content:`숲에 들어서고 나서야 다리에 힘이 풀렸어.

차가운 바위에 기대앉았어.

피가 계속 흐르고 있었어.

배도 고프고, 졸리기도 하고.

아까 그 숭배자 팔뚝 좀 더 뜯어올걸.

세상이 빙글빙글 돌았어.

회색이던 시야가 점점 까매졌어.

이제 진짜 끝인가 싶었는데.

그때 눈앞에 붉은 빛 하나가 나타났어.

깜깜한 숲속에서 혼자 선명하게 떠 있는 작은 나비.

나는 흐릿한 눈으로 그걸 바라보다가 마지막으로 생각했어.

저거.
